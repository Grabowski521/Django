<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Контакты</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
  <div class="container-fluid">
    <div class="row">
      <div class="col-2 bg-dark text-white d-flex flex-column vh-100">
        <div class="logo d-flex align-items-center p-3">
          <div class="bg-primary text-white rounded p-2 me-2">B</div>
          <span>МЕНЮ</span>
        </div>
        <nav class="nav flex-column">
          <a class="nav-link active text-white" href="index.html">Главная</a>
          <a class="nav-link text-white" href="categories.html">Категории</a>
          <a class="nav-link text-white" href="orders.html">Заказы</a>
          <a class="nav-link text-white" href="contacts.html">Контакты</a>
        </nav>
        <div class="user-profile mt-auto p-3">
          <div class="d-flex align-items-center">
            <div class="rounded-circle bg-secondary" style="width: 40px; height: 40px;"></div>
            <span class="ms-2">ПОЛЬЗОВАТЕЛЬ</span>
          </div>
          <div class="mt-2">
            <i class="bi bi-gear text-white"></i>
            <i class="bi bi-power text-white ms-2"></i>
          </div>
        </div>
      </div>
      <div class="col-10 p-4">
        <h1 class="text-center">КОНТАКТЫ</h1>
        <div class="row">
          <div class="col-md-6">
            <form>
              <div class="mb-3">
                <label for="name" class="form-label">Имя</label>
                <input type="text" class="form-control" id="name" placeholder="Имя">
              </div>
              <div class="mb-3">
                <label for="email" class="form-label">Почта</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                  <input type="email" class="form-control" id="email" placeholder="Почта">
                </div>
              </div>
              <div class="mb-3">
                <label for="message" class="form-label">Сообщение</label>
                <textarea class="form-control" id="message" rows="3" placeholder="Сообщение"></textarea>
              </div>
              <button type="submit" class="btn btn-primary">Отправить</button>
            </form>
          </div>
          <div class="col-md-6">
            <h2>НАШИ КОНТАКТЫ</h2>
            <p>Оставьте свои данные для связи с вами. Мы ответим в ближайшее время.</p>
            <p>Тестовый абзац.</p>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
